name: Sync built lib

# Keep lib/ (the committed build output git installs consume) in sync with
# src/ on every push to main, so repo-installed users always get a current
# bundle without a build step on their side.
#
# Branch protection requires pull requests for main, so this workflow opens a
# PR with the rebuilt lib instead of pushing directly — no bypass needed.

on:
    push:
        branches: ['main']

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'
            - run: npm install --no-audit --no-fund
            - run: npm run build
            - name: Open PR for rebuilt lib
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if git diff --quiet lib/; then
                      echo "lib/ unchanged; nothing to do"
                      exit 0
                  fi
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git checkout -b chore/rebuild-lib
                  git add lib/
                  git commit -m 'chore: rebuild lib'
                  git push -u origin chore/rebuild-lib
                  # If a PR for this branch already exists, pushing updated it.
                  gh pr create --base main --head chore/rebuild-lib \
                      --title 'chore: rebuild lib' \
                      --body 'Automated lib rebuild from the sync workflow.' || true
