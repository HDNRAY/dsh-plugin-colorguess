name: Sync built lib

# Keep lib/ (the committed build output git installs consume) in sync with
# src/ on every push to main, so repo-installed users always get a current
# bundle without a build step on their side.

on:
    push:
        branches: ['main']

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'
            - run: npm install --no-audit --no-fund
            - run: npm run build
            - name: Commit rebuilt lib
              run: |
                  if ! git diff --quiet lib/; then
                      git config user.name 'github-actions[bot]'
                      git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                      git add lib/
                      git commit -m 'chore: rebuild lib'
                      git push
                  fi
